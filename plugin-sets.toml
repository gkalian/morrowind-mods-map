# Plugin Sets shown on the Map, in load order.
# File names are looked up in the data directories listed in paths.local.toml.

# Pixels per Cell at the deepest zoom: 256, 512, 1024 or 2048.
# Each step doubles the sharpness of the landscape textures and roughly quadruples the tile data.
cell_pixels = 1024
# Smallest zoom level to build tiles for (the deepest one is 10 at 1024 pixels per Cell).
min_zoom = 2
# Colour of open water, also used as the page background.
water = [52, 78, 110]

# Old landmass of the whole continent, drawn under the mods where they have no land of their own.
[[set]]
id = "tamriel"
name = "Tamriel"
version = "4.0"
plugins = ["Tamriel.esm"]
backdrop_for = ["tr", "pc", "shotn"]
cell_pixels = 256

# Tribunal is part of the base game here: Mournhold has no exterior of its own, but Tribunal
# also adds the transport to and from it.
[[set]]
id = "morrowind"
name = "Morrowind"
plugins = ["Morrowind.esm", "Tribunal.esm"]
archives = ["Morrowind.bsa", "Tribunal.bsa"]
default_on = true
locked = true

[[set]]
id = "bloodmoon"
name = "Bloodmoon"
plugins = ["Bloodmoon.esm"]
archives = ["Tribunal.bsa", "Bloodmoon.bsa"]
default_on = true

[[set]]
id = "tr"
name = "Tamriel Rebuilt"
version = "26.09.27"
plugins = ["Tamriel_Data.esm", "TR_Mainland.esm"]

[[set]]
id = "pc"
name = "Project Cyrodiil"
version = "26.09a"
plugins = ["Cyr_Main.ESM"]

[[set]]
id = "shotn"
name = "Skyrim: Home of the Nords"
version = "26.09a"
plugins = ["Sky_Main.ESM"]

# The sets below come last so that rendering them changes nothing in the tiles of the sets above.

# Lokken island between Vvardenfell and Solstheim, made for Bloodmoon as it came. It comes before
# Tomb of the Snow Prince, which reshapes those waters: with both on, Solstheim is drawn over Lokken.
[[set]]
id = "whitewolf"
name = "White Wolf of Lokken"
version = "2.1"
plugins = ["BT_Whitewolf_2_0.esm"]

# Solstheim overhaul: replaces nearly all of Bloodmoon's land and objects, and is drawn over it.
[[set]]
id = "totsp"
name = "Solstheim Tomb of the Snow Prince"
version = "2.3.0"
plugins = ["Solstheim Tomb of The Snow Prince.esm"]

[[set]]
id = "wyrmhaven"
name = "Wyrmhaven"
version = "3.0"
plugins = ["Wyrmhaven.esm"]

[[set]]
id = "azurian"
name = "Lyithdonea: The Azurian Isles"
version = "0.3.1"
plugins = ["MD_Azurian Isles.esm"]
# The plugin by mistake names two Cells far from its islands Caldera and Sadrith Mora.
ignore_cell_names = [[27, -52], [46, -50]]

# Transport: what the transport data needs and the plugins do not say. Everything else (routes,
# which mods a carrier needs, propylon links, conditions) is read from the plugins.
# Keys are matched without regard to case; modes are land, water, air, guild, magic, propylon.
[transport]
# A character or creature with travel destinations is a carrier of this mode, by its class.
# The build lists the carriers whose class is not here; they are left out.
classes = { "Shipmaster" = "water", "Gondolier" = "water", "T_Mw_RiverstriderService" = "water", "T_Glb_Fisherman" = "water", "Caravaner" = "land", "Slave" = "land", "Guild Guide" = "guild" }
# Carriers whose class does not tell the mode, by their id.
actors = { "TR_m7_Relenu Drolan" = "air", "TR_m7_Ulath-Bael" = "air", "TR_m4_Nassuran Omoril" = "land", "TR_m1_DaedrothGindaman" = "guild", "Blatta Hateria" = "water", "vevrana aryon" = "water", "rindral dralor" = "water" }
# An activator script that moves the player while the player carries one of these items is a
# route of this mode; `*` at the end matches any ending.
gates = { "index_*" = "propylon", "T_De_Index_*" = "propylon" }
# Dialogue topics in which a character moves the player as a transport service. Other answers
# that move the player are quest events and are left out.
topics = { "transport to Mournhold" = "magic", "transport to Vvardenfell" = "magic" }

# Mournhold is all interiors; the Map shows it at this point on the old landmass of the backdrop.
[[transport.anchor]]
cells = "Mournhold"
position = [23.5, -27.5]
