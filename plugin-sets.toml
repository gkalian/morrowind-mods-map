# Plugin Sets shown on the Map, in load order.
# File names are looked up in the data directories listed in paths.local.toml.

# Pixels per Cell at the deepest zoom: 256, 512, 1024 or 2048.
# Each step doubles the sharpness of the landscape textures and roughly quadruples the tile data.
cell_pixels = 1024
# Smallest zoom level to build tiles for (the deepest one is 10 at 1024 pixels per Cell).
min_zoom = 2
# Colour of open water, also used as the page background.
water = [52, 78, 110]

# Old landmass of the whole continent, drawn under the mods where they have no land of their own.
[[set]]
id = "tamriel"
name = "Tamriel"
version = "4.0"
plugins = ["Tamriel.esm"]
backdrop_for = ["tr", "pc", "shotn"]
cell_pixels = 256

[[set]]
id = "morrowind"
name = "Morrowind"
plugins = ["Morrowind.esm"]
archives = ["Morrowind.bsa"]
default_on = true
locked = true

[[set]]
id = "bloodmoon"
name = "Bloodmoon"
plugins = ["Bloodmoon.esm"]
archives = ["Tribunal.bsa", "Bloodmoon.bsa"]
default_on = true

[[set]]
id = "tr"
name = "Tamriel Rebuilt"
version = "26.09.27"
plugins = ["Tamriel_Data.esm", "TR_Mainland.esm"]

[[set]]
id = "pc"
name = "Project Cyrodiil"
version = "26.09a"
plugins = ["Cyr_Main.ESM"]

[[set]]
id = "shotn"
name = "Skyrim: Home of the Nords"
version = "26.09a"
plugins = ["Sky_Main.ESM"]

# The sets below come last so that rendering them changes nothing in the tiles of the sets above.

# Lokken island between Vvardenfell and Solstheim, made for Bloodmoon as it came. It comes before
# Tomb of the Snow Prince, which reshapes those waters: with both on, Solstheim is drawn over Lokken.
[[set]]
id = "whitewolf"
name = "White Wolf of Lokken"
version = "2.1"
plugins = ["BT_Whitewolf_2_0.esm"]

# Solstheim overhaul: replaces nearly all of Bloodmoon's land and objects, and is drawn over it.
[[set]]
id = "totsp"
name = "Solstheim Tomb of the Snow Prince"
version = "2.3.0"
plugins = ["Solstheim Tomb of The Snow Prince.esm"]

[[set]]
id = "wyrmhaven"
name = "Wyrmhaven"
version = "3.0"
plugins = ["Wyrmhaven.esm"]

[[set]]
id = "azurian"
name = "Lyithdonea: The Azurian Isles"
version = "0.3.1"
plugins = ["MD_Azurian Isles.esm"]
# The plugin by mistake names two Cells far from its islands Caldera and Sadrith Mora.
ignore_cell_names = [[27, -52], [46, -50]]
