[package]
name = "esmap"
version = "0.1.0"
edition = "2021"
description = "Builds map tiles and location data from Morrowind plugin files"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["dds", "tga", "bmp", "png"] }
webp = { version = "0.3", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dependencies.tes3]
git = "https://github.com/Greatness7/tes3"
default-features = false
features = ["esp", "bsa"]

[profile.dev]
opt-level = 2
