# Where the game and the mods are on your machine.
# Copy this file to paths.local.toml and change the paths; paths.local.toml is never committed.

# Morrowind install: Morrowind.esm, Bloodmoon.esm, Tribunal.esm and their BSAs.
game_data_files = 'D:\Games\Morrowind\Data Files'

# Optional: folders of the Russian releases of the game and the mods, for the Russian names on the Map.
# Each holds the .cel files with the Russian Cell names, and the Russian plugins for the Region names.
russian_data_files = [
  'D:\Games\Morrowind RU\Data Files',
  'D:\Mods\Russian\td2608ru\data files',
  'D:\Mods\Russian\tr2609ru\data files',
  'D:\Mods\Russian\cyr2609ru\data files',
  'D:\Mods\Russian\sky2609ru\data files',
  'D:\Mods\Russian\White Wolf of Lokken RUS\Data Files',
  'D:\Mods\Russian\Solstheim Tomb of the Snow Prince RUS\Data Files',
  'D:\Mods\Russian\Wyrmhaven RUS\Data Files',
]

# One data directory per mod: the folder that holds its plugin files and its Textures folder.
# The names on the left are only labels. plugin-sets.toml lists the files that are looked for.
[mod_data_files]
tamriel_data = 'D:\Mods\Tamriel_Data\00 Data Files'
tamriel_rebuilt = 'D:\Mods\Tamriel Rebuilt\00 Core\Data Files'
project_cyrodiil = 'D:\Mods\Cyr_Main\00 Core'
skyrim_home_of_the_nords = 'D:\Mods\Sky_Main\00 Data Files'
tamriel = 'D:\Mods\Tamriel'
solstheim_tomb_of_the_snow_prince = 'D:\Mods\Solstheim Tomb of the Snow Prince\000 Core'
wyrmhaven = 'D:\Mods\Wyrmhaven'
white_wolf_of_lokken = 'D:\Mods\BT_Whitewolf_2_1\Data Files'
oaab_data = 'D:\Mods\OAAB_Data\00 Core'
azurian_isles = 'D:\Mods\MD_Azurian Isles\00 Core'

# Optional and not read by the build: where the downloaded archives are, as a note to yourself.
[mod_archives]
tamriel_data = 'D:\Downloads\Tamriel Data.7z'
